[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
[project]
name = "hentailib"
description = "Library for easy requests hentai sites"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["hentai", "requests", "rule34"]
authors = [
  {name = "Onii-Chan", email = "skobochki.ad@mail.ru"}
]
version = "0.5.1"

requires-python = ">=3.9"
classifiers = [
    # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 3 - Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Other Audience",
  "Topic :: Internet",
  "Topic :: Multimedia",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
    "requests~=2.32.5"
]

[project.urls]
Repository = "https://github.com/SerJo2/hentailib"
Issues = "https://github.com/SerJo2/hentailib/issues"
Changelog = "https://github.com/SerJo2/hentailib/blob/master/CHANGELOG.md"